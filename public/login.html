<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>TimeFold | Log In</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Noto+Sans+Balinese:wght@400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Varela+Round&display=swap"
        rel="stylesheet">

    <link rel="shortcut icon" href="https://pub-65a41022099b4c7d9a5694377a7e4ac5.r2.dev/svgs/Timefold-logo.svg">

</head>

<body style="margin: 0px;">

    <main>

        <!-- 
                                        STUEDENT LOGIN
        -->

        <div class="main-div" id="student-login">
            <div class="login-title">
                <div class="title-sub-div">
                    <img src="https://pub-65a41022099b4c7d9a5694377a7e4ac5.r2.dev/svgs/timefold-text-logo.svg">
                </div>
                <img class="login-img" src="https://pub-65a41022099b4c7d9a5694377a7e4ac5.r2.dev/svgs/studying.svg">
            </div>
            <div class="login-div">
                <h1 style="color: var(--purple-ink);">Log In</h1>
                <div class="form-content">
                    <div class="student-teacher-toggle">
                        <button class="student-teacher-toggle-button student-btn active-login-btn"
                            onclick="showLoginType('student')">
                            Student
                        </button>

                        <button class="student-teacher-toggle-button teacher-btn" onclick="showLoginType('teacher')">
                            Teacher
                        </button>
                    </div>
                    <form id="registration-form">


                        <div
                            style="display: flex; flex-direction: column; justify-content: center; align-items: center;">

                            <div class="input-div">
                                <input type="text" id="enroll" placeholder="Enrollment Number" required>
                            </div>

                            <div class="input-div">
                                <input type="password" id="password" placeholder="Password" required>
                            </div>

                            <div class="input-div">
                                <input type="text" id="batch" placeholder="Batch" required>
                            </div>

                        </div>

                        <div class="reg-link">
                            Haven't Register Yet? <a
                                style="text-decoration: none; color: rgb(169, 21, 21); font-size: 1rem; font-weight: 700; text-decoration: underline; align-items: center; width: 15vw; color: var(--purple-ink);"
                                href="register.html">Register here</a>
                        </div>
                        <br>

                        <button class="login-button"
                            style="width: 27.5vw; border-radius: 50px; padding: 0px 10px; height: 7vh;" type="button"
                            onclick="login()">Log In</button>
                    </form>
                </div>
            </div>

        </div>

        <!-- 
                                        TEACHER LOGIN
        -->

        <div class="main-div" id="teacher-login">
            <div class="login-title">
                <div class="title-sub-div">
                    <img src="https://pub-65a41022099b4c7d9a5694377a7e4ac5.r2.dev/svgs/timefold-text-logo.svg">
                </div>
                <img class="login-img" src="https://pub-65a41022099b4c7d9a5694377a7e4ac5.r2.dev/svgs/studying.svg">
            </div>
            <div class="login-div">
                <h1 style="color: var(--purple-ink);">Log In</h1>
                <div class="form-content">
                    <div class="student-teacher-toggle">
                        <button class="student-teacher-toggle-button student-btn active-login-btn"
                            onclick="showLoginType('student')">
                            Student
                        </button>

                        <button class="student-teacher-toggle-button teacher-btn" onclick="showLoginType('teacher')">
                            Teacher
                        </button>
                    </div>
                    <form id="registration-form">


                        <div
                            style="display: flex; flex-direction: column; justify-content: center; align-items: center;">

                            <div class="input-div">
                                <input type="text" class="faculty_id" id="Faculty_id" placeholder="Teacher_Id" required>
                            </div>

                            <div class="input-div">
                                <input type="password" class="faculty_password" id="Faculty_pasward" placeholder="Password" required>
                            </div>
                        </div>

                        <br>

                        <button class="login-button"
                            style="width: 27.5vw; border-radius: 50px; padding: 0px 10px; height: 7vh;" type="button"
                            onclick="teacherLogin()">
                            Log In
                        </button>
                    </form>
                </div>
            </div>

        </div>

    </main>

</body>
<script>



    // ------------------------------------------------------------------------------------------------------------------
    // TEACHER TOGGLE BUTTON
    // ------------------------------------------------------------------------------------------------------------------
    async function teacherLogin() {

        const id_teacher = document.getElementById('Faculty_id').value.trim();

        const teacher_pasward = document.getElementById('Faculty_pasward').value.trim();


        if (!id_teacher || !teacher_pasward) {

            alert("Please enter all fields.");

            return;



        }
        try {
            const res = await fetch("/teacherlogin", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({ id_teacher, teacher_pasward }),
            });

            const data = await res.json();

            if (res.ok) {
                alert(data.message);
                window.location.href = "/teacher-index.html"; // Teacher dashboard
            } else {
                alert(data.message || "Login failed");
            }
        } catch (err) {
            console.log(err);
            alert("Unable to connect to server");
        }
    }

        // ------------------------------------------------------------------------------------------------------------------
        // STUDENT-TEACHER TOGGLE BUTTON
        // ------------------------------------------------------------------------------------------------------------------

        function showLoginType(type) {

            const studentLogin = document.getElementById("student-login");
            const teacherLogin = document.getElementById("teacher-login");

            const studentBtns = document.querySelectorAll(".student-btn");
            const teacherBtns = document.querySelectorAll(".teacher-btn");

            if (type === "student") {

                studentLogin.style.display = "block";
                teacherLogin.style.display = "none";

                studentBtns.forEach(btn => {
                    btn.classList.add("active-login-btn");
                });

                teacherBtns.forEach(btn => {
                    btn.classList.remove("active-login-btn");
                });

            } else {

                studentLogin.style.display = "none";
                teacherLogin.style.display = "block";

                teacherBtns.forEach(btn => {
                    btn.classList.add("active-login-btn");
                });

                studentBtns.forEach(btn => {
                    btn.classList.remove("active-login-btn");
                });
            }
        }


        document.addEventListener("DOMContentLoaded", function () {
            showLoginType("student");
        });

        // ANIMATION SCRIPT

        function showLoginType(type) {
            const studentLogin = document.getElementById("student-login");
            const teacherLogin = document.getElementById("teacher-login");

            const studentBtns = document.querySelectorAll(".student-btn");
            const teacherBtns = document.querySelectorAll(".teacher-btn");

            const toggles = document.querySelectorAll(".student-teacher-toggle");

            if (type === "student") {

                studentLogin.style.display = "block";
                teacherLogin.style.display = "none";

                studentBtns.forEach(btn => {
                    btn.classList.add("active-login-btn");
                });

                teacherBtns.forEach(btn => {
                    btn.classList.remove("active-login-btn");
                });

                toggles.forEach(toggle => {
                    toggle.classList.remove("teacher-active");
                });

            } else {

                studentLogin.style.display = "none";
                teacherLogin.style.display = "block";

                teacherBtns.forEach(btn => {
                    btn.classList.add("active-login-btn");
                });

                studentBtns.forEach(btn => {
                    btn.classList.remove("active-login-btn");
                });

                toggles.forEach(toggle => {
                    toggle.classList.add("teacher-active");
                });
            }
        }

</script>

</html>
