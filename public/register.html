<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeFold | Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Noto+Sans+Balinese:wght@400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Varela+Round&display=swap"
        rel="stylesheet">

    <link rel="shortcut icon" href="https://pub-65a41022099b4c7d9a5694377a7e4ac5.r2.dev/svgs/Timefold-logo.svg">

    <link rel="stylesheet" href="css/style.css">
</head>

<body style="margin: 0px;">
    <!-- =========================================================
     TIMEFOLD REGISTER FULL SKELETON
     ========================================================= -->

    <div id="auth-skeleton" class="auth-skeleton">

        <div class="auth-skeleton-main-div">

            <!-- ================= REGISTER TITLE ================= -->

            <div class="auth-skeleton-title">

                <!-- TimeFold Logo / Title -->
                <div class="auth-skeleton-title-sub-div">

                    <div class="auth-skeleton-logo"></div>

                </div>

                <!-- Character Image -->
                <!-- <div class="auth-skeleton-character"></div> -->

            </div>


            <!-- ================= REGISTER CARD ================= -->

            <div class="auth-skeleton-card">

                <!-- Register Heading -->
                <div class="auth-skeleton-heading"></div>


                <!-- Full Name + Enrollment Number -->
                <div class="auth-skeleton-name-row">

                    <div class="auth-skeleton-field"></div>

                    <div class="auth-skeleton-field"></div>

                </div>


                <!-- Batch -->
                <div class="auth-skeleton-field"></div>


                <!-- Password -->
                <div class="auth-skeleton-field"></div>


                <!-- Confirm Password -->
                <div class="auth-skeleton-field"></div>


                <!-- Password Message -->
                <div class="auth-skeleton-password-message"></div>


                <!-- Login Link -->
                <div class="auth-skeleton-link"></div>


                <!-- Create Account Button -->
                <div class="auth-skeleton-button"></div>

            </div>

        </div>

    </div>

    <!-- ================= END REGISTER SKELETON ================= -->
    <main>

        <div class="main-div">
            <div class="register-title">
                <div class="title-sub-div">
                    <img src="https://pub-65a41022099b4c7d9a5694377a7e4ac5.r2.dev/svgs/timefold-text-logo.svg">
                </div>
                <img class="register-img" src="https://pub-65a41022099b4c7d9a5694377a7e4ac5.r2.dev/svgs/studying.svg">
            </div>
            <div class="register-div">
                <h1 style="color: var(--purple-ink);">Register</h1>
                <div class="form-content">
                    <form id="registration-form">

                        <div class="input-div">
                            <input style="border-radius: 50px 0px 0px 50px; width: 12.25vw;" type="text" id="name"
                                placeholder="Full Name" required>
                            <input style="border-radius: 0px 50px 50px 0px; width: 12.25vw;" type="text" id="enroll"
                                placeholder="Enrollment Number" required>
                        </div>

                        <div
                            style="display: flex; flex-direction: column; justify-content: center; align-items: center;">

                            <div class="input-div">
                                <input style="width: 84vw; border-radius: 50px;" type="text" id="batch"
                                    placeholder="Batch" required>
                            </div>

                            <div class="input-div password-input-div">
                                <input style="width: 84vw; border-radius: 50px;" type="password" id="password"
                                    placeholder="Password" required>

                                <button type="button" class="password-toggle" onclick="togglePassword('password', this)"
                                    aria-label="Show password">
                                    🐵
                                </button>
                            </div>

                            <div class="input-div password-input-div">
                                <input style="width: 84vw; border-radius: 50px;" type="password" id="confirm_password"
                                    placeholder="Confirm Password" required>

                                <button type="button" class="password-toggle"
                                    onclick="togglePassword('confirm_password', this)" aria-label="Show password">
                                    🐵
                                </button>
                            </div>

                        </div>

                        <div id="passwordMessage"> Password Must Be Same </div>

                        <div class="reg-link">
                            Already Registered? <a
                                style="text-decoration: none; color: rgb(169, 21, 21); font-size: 1rem; font-weight: 700; text-decoration: underline; align-items: center; width: 15vw; color: var(--purple-ink);"
                                href="login.html">Log In</a>
                        </div>

                        <button class="register-button"
                            style="width: 27.5vw; border-radius: 50px; padding: 0px 10px; height: 7vh;" type="button"
                            onclick="register()">Create Account</button>
                    </form>
                </div>
            </div>

        </div>
    </main>

</body>

<script>

        function hideAuthSkeleton() {
        const skeleton = document.getElementById("auth-skeleton");

        if (skeleton) {
            skeleton.remove();
        }
    }

        window.addEventListener("load", function () {
            hideAuthSkeleton();
    });




const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirm_password");
const passwordMessage = document.getElementById("passwordMessage");

function checkPassword() {
if (!confirmPassword.value) {
passwordMessage.textContent = "";
return;
}

if (password.value !== confirmPassword.value) {
passwordMessage.textContent = "Passwords do not match";
passwordMessage.style.color = "red";
} else {
passwordMessage.textContent = "Passwords match";
passwordMessage.style.color = "green";
}
}

confirmPassword.addEventListener("input", checkPassword);
password.addEventListener("input", checkPassword);

async function register() {
const name = document.getElementById('name').value.trim();
const enroll = document.getElementById('enroll').value.trim();
const passwordVal = document.getElementById('password').value.trim();
const confirm_password = document.getElementById('confirm_password').value.trim();
const batch = document.getElementById('batch').value.trim();

// 1. Check for empty fields
if (!name || !enroll || !passwordVal || !confirm_password || !batch) {
alert('Please enter all details');
return;
}

// 2. Validate password match
if (passwordVal !== confirm_password) {
alert('Passwords do not match');
return;
}

// 3. Database constraint checks (MSSQL VarChar limits)
if (passwordVal.length > 8) {
alert("Password cannot be more than 8 characters");
return;
}

if (enroll.length !== 12) {
alert("Enrollment number must be exactly 12 digits");
return;
}

if (name.length > 20) {
alert("Name cannot be more than 20 characters");
return;
}

try {
const response = await fetch("/register", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
name,
enroll,
password: passwordVal,
batch
})
});

const data = await response.json();

if (response.ok && data.success) {
alert(data.message || "Registration successful!");
window.location.href = "./login.html";
} else {
alert(data.message || "Registration failed");
}
} catch (error) {
console.error("Registration error:", error);
alert("Network error. Please try again.");
}
}

// -------------------------------------------------------------------------------------------------------------
// PASSWORD REVEAL BUTTON
// -------------------------------------------------------------------------------------------------------------

function togglePassword(inputId, button) {
const input = document.getElementById(inputId);

if (input.type === "password") {
input.type = "text";
button.textContent = "🙈";
button.setAttribute("aria-label", "Hide password");
} else {
input.type = "password";
button.textContent = "👁";
button.setAttribute("aria-label", "Show password");
}
}
</script>

</html>
