<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeFold | Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Noto+Sans+Balinese:wght@400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Varela+Round&display=swap"
        rel="stylesheet">

    <link rel="shortcut icon"
        href="https://pub-65a41022099b4c7d9a5694377a7e4ac5.r2.dev/svgs/Timefold-logo.svg">

    <link rel="stylesheet" href="css/style.css">
</head>

<body style="margin: 0px;">

    <main>

        <div class="main-div">
            <div class="register-title">
                <div class="title-sub-div">
                    <img src="https://pub-65a41022099b4c7d9a5694377a7e4ac5.r2.dev/svgs/timefold-text-logo.svg">
                </div>
                <img class="register-img" src="https://pub-65a41022099b4c7d9a5694377a7e4ac5.r2.dev/svgs/studying.svg">
            </div>
            <div class="register-div">
                <h1 style="color: var(--purple-ink);">Register</h1>
                <div class="form-content">
                    <form id="registration-form">

                        <div class="input-div">
                            <input style="border-radius: 50px 0px 0px 50px; width: 12.25vw;" type="text" id="name"
                                placeholder="Full Name" required>
                            <input style="border-radius: 0px 50px 50px 0px; width: 12.25vw;" type="text" id="enroll"
                                placeholder="Enrollment Number" required>
                        </div>

                        <div
                            style="display: flex; flex-direction: column; justify-content: center; align-items: center;">

                            <div class="input-div">
                                <input style="width: 26vw; border-radius: 50px;" type="text" id="batch"
                                    placeholder="Batch" required>
                            </div>

                            <div class="input-div">
                                <input style="width: 26vw; border-radius: 50px;" type="password" id="password"
                                    placeholder="Password" required>
                            </div>

                            <div class="input-div">
                                <input style="width: 26vw; border-radius: 50px;" type="password" id="confirm_password"
                                    placeholder="Confirm Password" required>
                            </div>

                        </div>

                        <div id="passwordMessage"> Password Must Be Same </div>

                        <button class="register-button"
                            style="width: 27.5vw; border-radius: 50px; padding: 0px 10px; height: 7vh;" type="button"
                            onclick="register()">Create Account</button>
                    </form>
                </div>
            </div>

        </div>
    </main>

</body>
<script>
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirm_password");
    const passwordMessage = document.getElementById("passwordMessage");

    function checkPassword() {
        if (confirmPassword.value === "") {
            passwordMessage.textContent = "";
            return;
        }

        if (password.value !== confirmPassword.value) {
            passwordMessage.textContent = "Passwords do not match";
            passwordMessage.style.color = "red";
        } else {
            passwordMessage.textContent = "Password Is Same";
            passwordMessage.style.color = "rgb(69, 13, 95)";
        }
    }


    confirmPassword.addEventListener("input", checkPassword);

    async function register() {

        const name = await document.getElementById('name').value;
        const enroll = await document.getElementById('enroll').value;
        const password = await document.getElementById('password').value;
        const confirm_password = await document.getElementById('confirm_password').value;
        const batch = await document.getElementById('batch').value;

        if (!name || !enroll || !password || !batch) {
            alert('Please enter all details');
            return;
        }
        if (password !== confirm_password) {
            alert('Passwords do not match');
            return;
        }

        const response = await fetch("/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name,
                enroll,
                password,
                batch
            })
        });
        console.log(name, enroll, password, batch);


        const data = await response.json();
        if (response.ok) {
            alert(data.message)
            window.location.href = "./login.html"

        } else {
            alert(data.message);
        }

    }


</script>

</html>
